name: 排队数据定时采集

on:
  schedule:
    # 每 10 分钟采集一次（UTC）
    - cron: '*/10 * * * *'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect & push to server
        env:
          RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
          RELAY_TOKEN:  ${{ secrets.RELAY_TOKEN }}
        run: python collect_push.py
